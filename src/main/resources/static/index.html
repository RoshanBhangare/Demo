<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7ff">
  <title>Create your account</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="signup-card">
    <div class="brand" aria-label="Create account">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Brightside</span>
    </div>

    <h1>Create your account</h1>
    <p class="intro">Get started today. It only takes a minute.</p>

    <form action="#" method="post">
      <div class="form-row">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" placeholder="Alex" required>
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" name="lastName" type="text" autocomplete="family-name" placeholder="Morgan" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
      </div>

      <label class="terms" for="terms">
        <input id="terms" name="terms" type="checkbox" required>
        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
      </label>

      <button type="submit">Create account</button>
    </form>

    <p class="login">Already have an account? <a href="#">Log in</a></p>
  </main>
  <script src="/script.js" defer></script>
</body>
</html>
